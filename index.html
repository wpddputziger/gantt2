<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GANTT2</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />

</head>
<body>
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 1rem; background: #f8f9fa; border-bottom: 1px solid #ccc;">
  <div class="header-left" style="display: flex; align-items: center; gap: 1rem;">
    <h1 style="margin: 0;">GANTT2 <span style="font-size: 0.8rem; color: #999;">v0.2.3</span></h1>
    <input type="text" id="projectName" placeholder="Untitled Project" style="padding: 0.3rem; border: 1px solid #ccc; border-radius: 4px;" />
  </div>

  <div class="header-right" style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem;">
  <div class="button-group" id="group-project">
    <button id="newProject">🧹 New Project</button>
    <button id="importBtn">📥 Import</button>
    <button id="exportBtn">📤 Export</button>
  </div>

  <div class="button-group" id="group-task">
    <button id="addPrimaryStart">🆕 Task (Start Aligned)</button>
    <button id="addPrimaryEnd">🆕 Task (End Aligned)</button>
    <button id="addSub">➕ Sub Task</button>
    <button id="deleteTask">🗑️ Delete Task</button>
  </div>

  <div class="button-group" id="group-editor">
    <button id="toggleEditor">🪟 Toggle Editor</button>
    <button id="openTimelineSettings">⚙️ Timeline Settings</button>
  </div>
</div>

</header>


<main>
  <section id="timeline">
    <!-- Tasks will be rendered here -->
  </section>

  <aside id="editor">
    <div class="editor-tabs">
      <button class="tab-btn active" id="tabProject">📁 Project</button>
      <button class="tab-btn disabled" id="tabTask">🧱 Task</button>
      <button class="tab-btn disabled" id="tabSubtask">🧷 Subtask</button>
      <button class="tab-btn disabled" id="tabTimeline">⚙️ Timeline</button>
    </div>

    <div class="tab-panel" id="panelProject">
      <h2>Project Editor</h2>
      <label>Project Name: <input type="text" id="projectNameField" /></label>
      <button id="applyProjectName">✔ Apply Project Name</button>
      <p class="small-note">This name is used in the filename for exports.</p>
    </div>

    <div class="tab-panel hidden" id="panelTask">
      <h2>Primary Task Editor</h2>
      <div id="taskFields"></div>
      <button id="deleteTaskFromEditor" style="margin-top: 1rem; background: #dc3545; color: white; padding: 0.5rem; border: none; border-radius: 6px;">
  🗑 Delete This Task
</button>
<button id="applyTaskChanges" style="margin-top: 1rem; background: #007bff; color: white; padding: 0.5rem; border: none; border-radius: 6px;">
  ✅ Apply Changes
</button>

    </div>

    <div class="tab-panel hidden" id="panelSubtask">
      <h2>Subtask Editor</h2>
      <div id="subtaskFields"></div>
      <div id="subtaskFields"></div>

<button id="applySubtaskChanges" style="margin-top: 1rem; background: #007bff; color: white; padding: 0.5rem; border: none; border-radius: 6px;">
  ✅ Apply Changes
</button>

<button id="deleteSubtask" style="margin-top: 0.5rem; background: #dc3545; color: white; padding: 0.4rem; border: none; border-radius: 6px;">
  🗑️ Delete Subtask
</button>

    </div>

    <div class="tab-panel hidden" id="panelTimeline">
      <h2>Timeline Settings</h2>
      <label>Default Task Duration (days):
        <input type="number" id="defaultDuration" value="3" min="1" />
      </label>
      <label>Timeline Background Color:
        <input type="color" id="timelineBgColor" />
      </label>
      <label>Snap To:
        <select id="snapTo">
          <option value="none">None</option>
          <option value="day">Day</option>
          <option value="week">Week</option>
        </select>
      </label>
      <label>
  Auto-Assign Colors:
  <input type="checkbox" id="autoColorToggle" checked />
</label>

    </div>
  </aside>
</main>
<footer style="padding: 0.5rem; background: #fff; border-top: 1px solid #ccc; display: flex; justify-content: center; gap: 0.5rem; position: sticky; bottom: 0; z-index: 100;">
  <button id="zoomIn">🔍 ZOOM +</button>
  <button id="fitWidth">🧩 Fit Width</button>
  <button id="collapseAll">📉 Collapse</button>
  <button id="expandAll">📈 Expand</button>
</footer>


  <input type="file" id="fileInput" accept=".json" style="display:none"/>

  <script src="script.js"></script>
</body>
</html>
