<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GANTT2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1>GANTT2 <span class="version-tag">v0.2.1</span></h1>
      <input type="text" id="projectName" placeholder="Untitled Project" disabled />
    </div>

    <div class="button-bar">
      <div class="group project-controls">
        <button id="newProject">🧹 New Project</button>
        <button id="importBtn">📥 Import</button>
        <button id="exportBtn">📤 Export</button>
      </div>

      <div class="group task-controls">
        <button id="addPrimaryStart">➕ Task (Start Aligned)</button>
        <button id="addPrimaryEnd">➕ Task (End Aligned)</button>
        <button id="addSub">➕ Sub Task</button>
        <button id="deleteTask">🗑️ Delete Task</button>
      </div>

      <div class="group settings-controls">
        <button id="toggleEditor">🪟 Toggle Editor</button>
        <button id="openTimelineSettings">⚙️ Timeline Settings</button>
      </div>
    </div>
  </header>

  <main>
    <section id="timeline">
      <!-- Tasks will appear here -->
    </section>

    <aside id="editor">
      <h2>Task Editor</h2>
      <div id="editorContent">
        <label>Name: <input id="taskName" type="text"/></label>
        <label>Start: <input id="taskStart" type="date"/></label>
        <label>End: <input id="taskEnd" type="date"/></label>
        <label>Status: 
          <select id="taskStatus">
            <option value="future">🕓 Future</option>
            <option value="active">🚀 Active</option>
            <option value="paused">⏸️ Paused</option>
            <option value="complete">✅ Complete</option>
          </select>
        </label>
        <label>Notes: <textarea id="taskNotes"></textarea></label>
        <label>Assigned To: <input id="taskAssigned" type="text"/></label>
        <label>Background Color:
          <select id="taskColor">
            <option value="#F94144">Red</option>
            <option value="#F3722C">Orange</option>
            <option value="#F8961E">Amber</option>
            <option value="#F9844A">Coral</option>
            <option value="#43AA8B">Teal</option>
            <option value="#577590">Blue</option>
            <option value="#9A5AFF">Purple</option>
            <option value="#FF61C0">Pink</option>
            <option value="custom">🎨 Custom...</option>
          </select>
          <input type="color" id="customColor" style="display:none;"/>
        </label>
        <label>Font Color: <input id="taskFontColor" type="color" /></label>
        <button id="saveTask">✅ Apply Changes</button>
      </div>
    </aside>

    <!-- Timeline Settings Panel -->
    <div id="timelineSettingsPanel" class="hidden">
      <h3>Timeline Settings</h3>
      <label>Default Task Duration (days):
        <input type="number" id="defaultDuration" value="3" min="1" />
      </label>
      <label>Timeline Background Color:
        <input type="color" id="timelineBgColor" />
      </label>
      <label>Snap To:
        <select id="snapTo">
          <option value="none">None</option>
          <option value="day">Day</option>
          <option value="week">Week</option>
        </select>
      </label>
      <button id="closeSettings">Close</button>
    </div>
  </main>

  <footer>
    <button id="zoomIn">🔍 ZOOM +</button>
    <button id="fitWidth">🧩 Fit Width</button>
    <button id="collapseAll">📉 Collapse</button>
    <button id="expandAll">📈 Expand</button>
  </footer>

  <input type="file" id="fileInput" accept=".json" style="display:none"/>

  <script src="script.js"></script>
</body>
</html>
