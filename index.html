<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GANTT2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1>GANTT2 <span class="version-tag">v0.2.2</span></h1>
      <input type="text" id="projectName" placeholder="Untitled Project" disabled />
    </div>

    <div class="button-bar">
      <div class="group project-controls">
        <button id="newProject">🧹 New Project</button>
        <button id="importBtn">📥 Import</button>
        <button id="exportBtn">📤 Export</button>
      </div>

      <div class="group task-controls">
        <button id="addPrimaryStart">🆕 Task (Start Aligned)</button>
        <button id="addPrimaryEnd">🆕 Task (End Aligned)</button>
        <button id="addSub">➕ Sub Task</button>
        <button id="deleteTask">🗑️ Delete Task</button>
      </div>

      <div class="group settings-controls">
        <button id="toggleEditor">🪟 Toggle Editor</button>
        <button id="openTimelineSettings">⚙️ Timeline Settings</button>
      </div>
    </div>
  </header>

  <main>
    <section id="timeline">
      <!-- Tasks will appear here -->
    </section>

    <aside id="editor">
      <!-- Tab Buttons -->
      <div class="editor-tabs">
        <button class="tab-btn active" id="tabProject">📁 Project</button>
        <button class="tab-btn disabled" id="tabTask">🧱 Task</button>
        <button class="tab-btn disabled" id="tabSubtask">🧷 Subtask</button>
        <button class="tab-btn disabled" id="tabTimeline">⚙️ Timeline</button>
      </div>

      <!-- Tab Panels -->
      <div class="tab-panel" id="panelProject">
        <h2>Project Editor</h2>
        <label>Project Name: <input type="text" id="projectNameField" /></label>
        <button id="applyProjectName">✔ Apply Project Name</button>
        <p class="small-note">This name is used in the filename for exports.</p>
      </div>

      <div class="tab-panel hidden" id="panelTask">
        <h2>Primary Task Editor</h2>
        <div id="taskFields"></div>
      </div>

      <div class="tab-panel hidden" id="panelSubtask">
        <h2>Subtask Editor</h2>
        <div id="subtaskFields"></div>
      </div>

      <div class="tab-panel hidden" id="panelTimeline">
        <h2>Timeline Settings</h2>
        <label>Default Task Duration (days):
          <input type="number" id="defaultDuration" value="3" min="1" />
        </label>
        <label>Timeline Background Color:
          <input type="color" id="timelineBgColor" />
        </label>
        <label>Snap To:
          <select id="snapTo">
            <option value="none">None</option>
            <option value="day">Day</option>
            <option value="week">Week</option>
          </select>
        </label>
      </div>
    </aside>
  </main>

  <footer>
    <button id="zoomIn">🔍 ZOOM +</button>
    <button id="fitWidth">🧩 Fit Width</button>
    <button id="collapseAll">📉 Collapse</button>
    <button id="expandAll">📈 Expand</button>
  </footer>

  <input type="file" id="fileInput" accept=".json" style="display:none"/>

  <script src="script.js"></script>
</body>
</html>
